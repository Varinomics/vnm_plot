name: CI FreeBSD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-rhi:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: QRhi (FreeBSD)
            text: OFF
            benchmark: OFF
            examples: OFF
          - name: QRhi+Text (FreeBSD)
            text: ON
            benchmark: ON
            examples: ON
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download shared FreeBSD Qt SDK
        id: qt-sdk
        uses: Varinomics/qt-freebsd@master
        with:
          minimum-qt-version: '6.12'

      - name: Build and test (FreeBSD 15.x)
        uses: vmactions/freebsd-vm@v1
        env:
          TEXT: ${{ matrix.text }}
          BENCHMARK: ${{ matrix.benchmark }}
          EXAMPLES: ${{ matrix.examples }}
          QT_SDK_DIRECTORY: ${{ steps.qt-sdk.outputs.directory }}
          QT_SDK_PREFIX: ${{ steps.qt-sdk.outputs.prefix }}
        with:
          # Keep the userland aligned with the FreeBSD:15 latest package repository.
          release: "15"
          cpu: 2
          usesh: true
          envs: 'TEXT BENCHMARK EXAMPLES QT_SDK_DIRECTORY QT_SDK_PREFIX'
          prepare: |
            set -eu
            pkg bootstrap -fy
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { enabled: no }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            echo 'FreeBSD: { url: https://pkg.FreeBSD.org/${ABI}/latest }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg update -f
            pkg install -y git cmake ninja pkgconf python3 xauth xorg-vfbserver
          run: |
            set -eu
            export CMAKE_BUILD_PARALLEL_LEVEL=2
            python3 "$QT_SDK_DIRECTORY/sdk.py" install \
              --directory "$QT_SDK_DIRECTORY" --minimum-qt-version 6.12
            mkdir -p build
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="$QT_SDK_PREFIX" \
              -DVNM_PLOT_ENABLE_TEXT=${TEXT} \
              -DVNM_PLOT_BUILD_TESTS=ON \
              -DVNM_PLOT_BUILD_BENCHMARK=${BENCHMARK} \
              -DVNM_PLOT_BUILD_EXAMPLES=${EXAMPLES} \
              -DVNM_PLOT_BUILD_FUNCTION_PLOTTER=OFF
            cmake --build build --config Release --parallel 2
            Xvfb :99 -screen 0 1280x1024x24 >/tmp/vnm-plot-xvfb.log 2>&1 &
            export DISPLAY=:99
            (cd build && ctest --output-on-failure)
